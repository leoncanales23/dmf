<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMF Academy — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0a0806;color:#f2ede6;font-family:'Archivo',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
::selection{background:#ff5b1e;color:#0a0806}
a{color:#ff5b1e;text-decoration:none;transition:color .2s}
a:hover{color:#ff7a45}

.login-container{width:100%;max-width:420px}
.login-brand{text-align:center;margin-bottom:48px}
.login-brand-name{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:#f2ede6;margin-bottom:8px}
.login-brand-sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#ff5b1e}
.login-card{border:1px solid rgba(242,237,230,.1);padding:40px 32px;background:rgba(242,237,230,.02)}
.login-title{font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.login-subtitle{font-size:13px;color:#8a8178;margin-bottom:32px;letter-spacing:.02em}
.login-field{margin-bottom:20px}
.login-label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#665f58;margin-bottom:8px}
.login-input{width:100%;padding:14px 16px;background:rgba(242,237,230,.04);border:1px solid rgba(242,237,230,.12);color:#f2ede6;font-family:'Archivo',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.login-input:focus{border-color:#ff5b1e}
.login-input::placeholder{color:#665f58}
.login-btn{width:100%;padding:16px;font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#0a0806;background:#ff5b1e;border:none;cursor:pointer;transition:background .2s;margin-top:8px}
.login-btn:hover{background:#ff7a45}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{display:none;margin-top:16px;padding:12px 16px;background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.3);font-size:13px;color:#ff6b6b}
.login-footer{text-align:center;margin-top:32px;font-size:12px;color:#665f58;letter-spacing:.04em}
.login-footer a{font-size:12px}
.login-toggle{text-align:center;margin-top:20px;font-size:12px;color:#665f58;letter-spacing:.02em}
.login-toggle a{font-size:12px;cursor:pointer}
.login-demo-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;padding:10px 16px;border:1px solid rgba(255,91,30,.3);background:rgba(255,91,30,.05)}
.login-demo-badge-dot{width:6px;height:6px;border-radius:50%;background:#ff5b1e;animation:pulse 2s infinite}
.login-demo-badge-text{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#ffb599}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-brand">
    <div class="login-brand-name">Demian Muller</div>
    <div class="login-brand-sub">DMF Academy // Student Portal</div>
  </div>

  <div id="demoBadge" class="login-demo-badge" style="display:none">
    <span class="login-demo-badge-dot"></span>
    <span class="login-demo-badge-text">Demo Mode Active</span>
  </div>

  <div class="login-card">
    <div class="login-title" id="formTitle">Student Access</div>
    <div class="login-subtitle" id="formSubtitle">Enter your credentials to access the training portal</div>

    <form id="loginForm" autocomplete="on">
      <div class="login-field">
        <label class="login-label" for="loginEmail">Email</label>
        <input class="login-input" type="email" id="loginEmail" name="email" placeholder="student@email.com" required autocomplete="email">
      </div>
      <div class="login-field">
        <label class="login-label" for="loginPassword">Password</label>
        <input class="login-input" type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="login-field" id="confirmField" style="display:none">
        <label class="login-label" for="loginConfirm">Confirm Password</label>
        <input class="login-input" type="password" id="loginConfirm" name="confirm" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="login-btn" type="submit" id="loginBtn">Enter Portal</button>
    </form>

    <div class="login-error" id="loginError"></div>

    <div class="login-toggle" id="toggleMode">
      <span id="toggleText">Don't have an account?</span> <a id="toggleLink" onclick="window.__dmfToggleMode()">Create one</a>
    </div>
  </div>

  <div class="login-footer">
    <a href="/">← Back to DMF</a>
  </div>
</div>

<script src="/academy-env.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
var __dmfFirebaseReady = false;
if (window.__DMF_FIREBASE_CONFIG__) {
  try {
    if (typeof firebase !== 'undefined' && firebase.initializeApp) {
      firebase.initializeApp(window.__DMF_FIREBASE_CONFIG__);
      __dmfFirebaseReady = !!(firebase.apps && firebase.apps.length > 0 && firebase.auth);
    }
  } catch (e) {
    __dmfFirebaseReady = false;
  }
}
</script>
<script>
(function () {
  'use strict';

  var DEMO_MODE = !!(window.__DMF_ACADEMY_DEMO__);
  var purchaseEnvironment = 'production';
  try {
    purchaseEnvironment = sessionStorage.getItem('dmf_purchase_environment') === 'sandbox' ? 'sandbox' : 'production';
  } catch (_) { /* ignore */ }
  var PAYMENTS_URL = purchaseEnvironment === 'sandbox'
    ? 'https://dmf-payments-sandbox.vibraalto-cl.workers.dev'
    : (window.__DMF_PAYMENTS_URL__ || 'https://dmf-payments.vibraalto-cl.workers.dev');
  var isSignUp = false;

  var demoBadge = document.getElementById('demoBadge');
  if (DEMO_MODE && demoBadge) demoBadge.style.display = 'flex';

  var form = document.getElementById('loginForm');
  var errorEl = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  var confirmField = document.getElementById('confirmField');
  var formTitle = document.getElementById('formTitle');
  var formSubtitle = document.getElementById('formSubtitle');
  var toggleText = document.getElementById('toggleText');
  var toggleLink = document.getElementById('toggleLink');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function hideError() {
    errorEl.style.display = 'none';
  }

  function updateMode() {
    hideError();
    if (isSignUp) {
      formTitle.textContent = 'Create Account';
      formSubtitle.textContent = 'Set up your student account to access DMF Academy';
      btn.textContent = 'CREATE ACCOUNT';
      confirmField.style.display = 'block';
      document.getElementById('loginConfirm').required = true;
      toggleText.textContent = 'Already have an account?';
      toggleLink.textContent = 'Sign in';
    } else {
      formTitle.textContent = 'Student Access';
      formSubtitle.textContent = 'Enter your credentials to access the training portal';
      btn.textContent = 'ENTER PORTAL';
      confirmField.style.display = 'none';
      document.getElementById('loginConfirm').required = false;
      toggleText.textContent = "Don't have an account?";
      toggleLink.textContent = 'Create one';
    }
  }

  window.__dmfToggleMode = function () {
    isSignUp = !isSignUp;
    updateMode();
  };

  try {
    var pending = sessionStorage.getItem('dmf_purchase_intent');
    if (pending) isSignUp = true;
  } catch (ex) { /* ignore */ }
  updateMode();

  function consumePurchaseIntent() {
    try {
      var intent = sessionStorage.getItem('dmf_purchase_intent');
      if (intent) {
        sessionStorage.removeItem('dmf_purchase_intent');
        return intent;
      }
    } catch (ex) { /* ignore */ }
    return null;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      showError('Please enter email and password.');
      return;
    }

    if (isSignUp) {
      var confirm = document.getElementById('loginConfirm').value;
      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }
    }

    btn.disabled = true;
    btn.textContent = 'CONNECTING...';

    if (DEMO_MODE) {
      setTimeout(function () {
        try { sessionStorage.setItem('dmf_auth', JSON.stringify({ email: email, demo: true, ts: Date.now() })); } catch (ex) { /* ignore */ }
        consumePurchaseIntent();
        window.location.href = '/academy';
      }, 600);
      return;
    }

    if (!__dmfFirebaseReady) {
      btn.disabled = false;
      btn.textContent = isSignUp ? 'CREATE ACCOUNT' : 'ENTER PORTAL';
      showError('Authentication service is not configured.');
      return;
    }

    var authPromise;
    if (isSignUp) {
      authPromise = firebase.auth().createUserWithEmailAndPassword(email, password);
    } else {
      authPromise = firebase.auth().signInWithEmailAndPassword(email, password);
    }

    authPromise
      .then(function () {
        var intent = consumePurchaseIntent();
        if (intent) {
          btn.textContent = 'REDIRECTING TO PAYMENT...';
          firebase.auth().currentUser.getIdToken()
            .then(function (idToken) {
              return fetch(PAYMENTS_URL + '/create-preference', {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + idToken,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ productId: intent })
              });
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.ok && data.init_point) {
                window.location.href = data.init_point;
              } else {
                window.location.href = '/academy';
              }
            })
            .catch(function () {
              window.location.href = '/academy';
            });
          return;
        }
        window.location.href = '/academy';
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = isSignUp ? 'CREATE ACCOUNT' : 'ENTER PORTAL';
        var msg = 'Invalid email or password.';
        if (err.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
        else if (err.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
        else if (err.code === 'auth/email-already-in-use') msg = 'An account with this email already exists. Try signing in.';
        else if (err.code === 'auth/weak-password') msg = 'Password must be at least 6 characters.';
        showError(msg);
      });
  });
})();
</script>

</body>
</html>
