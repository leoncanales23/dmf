<script>
/* DMF language: Spanish by default; the visitor's choice (here or on the landing) persists as dmf_lang ('es' | 'en').
   Presentation only: nothing below touches authentication, payments or course access. */
(function(){var l='es';try{var s=localStorage.getItem('dmf_lang');if(s==='en'||s==='es')l=s;}catch(e){}document.documentElement.lang=l;})();
window.DMF_I18N = (function () {
  var lang = document.documentElement.lang === 'en' ? 'en' : 'es';
  var UI = {
    "es": {
      "pageTitle": "DMF Academy — Acceso estudiantes",
      "brandSub": "DMF Academy // Portal del estudiante",
      "demoBadge": "Modo demo activo",
      "titleLogin": "Acceso estudiantes",
      "subLogin": "Ingresa tus credenciales para acceder al portal de formación",
      "btnLogin": "Entrar al portal",
      "toSignupText": "¿No tienes cuenta?",
      "toSignupLink": "Crear una",
      "titleSignup": "Crear cuenta",
      "subSignup": "Crea tu cuenta de estudiante para acceder a DMF Academy",
      "btnSignup": "Crear cuenta",
      "toLoginText": "¿Ya tienes cuenta?",
      "toLoginLink": "Iniciar sesión",
      "labelEmail": "Email",
      "labelPassword": "Contraseña",
      "labelConfirm": "Confirmar contraseña",
      "placeholderEmail": "estudiante@email.com",
      "back": "← Volver a DMF",
      "connecting": "Conectando…",
      "redirecting": "Redirigiendo al pago…",
      "errMissing": "Ingresa tu email y tu contraseña.",
      "errMismatch": "Las contraseñas no coinciden.",
      "errShort": "La contraseña debe tener al menos 6 caracteres.",
      "errNoAuth": "El servicio de autenticación no está configurado.",
      "errInvalid": "Email o contraseña incorrectos.",
      "errTooMany": "Demasiados intentos. Inténtalo más tarde.",
      "errBadEmail": "Ingresa un email válido.",
      "errInUse": "Ya existe una cuenta con este email. Intenta iniciar sesión.",
      "langSwitch": "English",
      "langSwitchAria": "Ver esta página en inglés"
    },
    "en": {
      "pageTitle": "DMF Academy — Login",
      "brandSub": "DMF Academy // Student Portal",
      "demoBadge": "Demo Mode Active",
      "titleLogin": "Student Access",
      "subLogin": "Enter your credentials to access the training portal",
      "btnLogin": "Enter Portal",
      "toSignupText": "Don't have an account?",
      "toSignupLink": "Create one",
      "titleSignup": "Create Account",
      "subSignup": "Set up your student account to access DMF Academy",
      "btnSignup": "Create Account",
      "toLoginText": "Already have an account?",
      "toLoginLink": "Sign in",
      "labelEmail": "Email",
      "labelPassword": "Password",
      "labelConfirm": "Confirm Password",
      "placeholderEmail": "student@email.com",
      "back": "← Back to DMF",
      "connecting": "Connecting…",
      "redirecting": "Redirecting to payment…",
      "errMissing": "Please enter email and password.",
      "errMismatch": "Passwords do not match.",
      "errShort": "Password must be at least 6 characters.",
      "errNoAuth": "Authentication service is not configured.",
      "errInvalid": "Invalid email or password.",
      "errTooMany": "Too many attempts. Try again later.",
      "errBadEmail": "Please enter a valid email address.",
      "errInUse": "An account with this email already exists. Try signing in.",
      "langSwitch": "Español",
      "langSwitchAria": "View this page in Spanish"
    }
  };
  function t(key) {
    if (Object.prototype.hasOwnProperty.call(UI[lang], key)) return UI[lang][key];
    return Object.prototype.hasOwnProperty.call(UI.es, key) ? UI.es[key] : key;
  }
  function apply() {
    var i, els = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute('data-i18n'));
    els = document.querySelectorAll('[data-i18n-placeholder]');
    for (i = 0; i < els.length; i++) els[i].setAttribute('placeholder', t(els[i].getAttribute('data-i18n-placeholder')));
    els = document.querySelectorAll('[data-lang-switch]');
    for (i = 0; i < els.length; i++) {
      els[i].textContent = t('langSwitch');
      els[i].setAttribute('aria-label', t('langSwitchAria'));
      els[i].setAttribute('lang', lang === 'es' ? 'en' : 'es');
      els[i].onclick = function () {
        try { localStorage.setItem('dmf_lang', lang === 'es' ? 'en' : 'es'); } catch (e) { /* ignore */ }
        window.location.reload();
      };
    }
    document.title = t('pageTitle');
  }
  return { lang: lang, t: t, apply: apply };
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0a0806;color:#f2ede6;font-family:'Archivo',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
::selection{background:#ff5b1e;color:#0a0806}
a{color:#ff5b1e;text-decoration:none;transition:color .2s}
a:hover{color:#ff7a45}

.login-container{width:100%;max-width:420px}
.login-brand{text-align:center;margin-bottom:48px}
.login-brand-name{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:#f2ede6;margin-bottom:8px}
.login-brand-sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#ff5b1e}
.login-card{border:1px solid rgba(242,237,230,.1);padding:40px 32px;background:rgba(242,237,230,.02)}
.login-title{font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.login-subtitle{font-size:13px;color:#8a8178;margin-bottom:32px;letter-spacing:.02em}
.login-field{margin-bottom:20px}
.login-label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#665f58;margin-bottom:8px}
.login-input{width:100%;padding:14px 16px;background:rgba(242,237,230,.04);border:1px solid rgba(242,237,230,.12);color:#f2ede6;font-family:'Archivo',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.login-input:focus{border-color:#ff5b1e}
.login-input::placeholder{color:#665f58}
.login-btn{width:100%;padding:16px;font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#0a0806;background:#ff5b1e;border:none;cursor:pointer;transition:background .2s;margin-top:8px}
.login-btn:hover{background:#ff7a45}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{display:none;margin-top:16px;padding:12px 16px;background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.3);font-size:13px;color:#ff6b6b}
.login-footer{text-align:center;margin-top:32px;font-size:12px;color:#665f58;letter-spacing:.04em}
.login-footer a{font-size:12px}
.dmf-lang-switch{background:none;border:0;padding:0;margin-left:18px;font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.04em;color:#8a8178;cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:color .2s}
.dmf-lang-switch:hover{color:#ff5b1e}
.login-toggle{text-align:center;margin-top:20px;font-size:12px;color:#665f58;letter-spacing:.02em}
.login-toggle a{font-size:12px;cursor:pointer}
.login-demo-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;padding:10px 16px;border:1px solid rgba(255,91,30,.3);background:rgba(255,91,30,.05)}
.login-demo-badge-dot{width:6px;height:6px;border-radius:50%;background:#ff5b1e;animation:pulse 2s infinite}
.login-demo-badge-text{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#ffb599}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-brand">
    <div class="login-brand-name">Demian Muller</div>
    <div class="login-brand-sub" data-i18n="brandSub">DMF Academy // Portal del estudiante</div>
  </div>

  <div id="demoBadge" class="login-demo-badge" style="display:none">
    <span class="login-demo-badge-dot"></span>
    <span class="login-demo-badge-text" data-i18n="demoBadge">Modo demo activo</span>
  </div>

  <div class="login-card">
    <div class="login-title" id="formTitle">Acceso estudiantes</div>
    <div class="login-subtitle" id="formSubtitle">Ingresa tus credenciales para acceder al portal de formación</div>

    <form id="loginForm" autocomplete="on">
      <div class="login-field">
        <label class="login-label" for="loginEmail" data-i18n="labelEmail">Email</label>
        <input class="login-input" type="email" id="loginEmail" name="email" placeholder="estudiante@email.com" data-i18n-placeholder="placeholderEmail" required autocomplete="email">
      </div>
      <div class="login-field">
        <label class="login-label" for="loginPassword" data-i18n="labelPassword">Contraseña</label>
        <input class="login-input" type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="login-field" id="confirmField" style="display:none">
        <label class="login-label" for="loginConfirm" data-i18n="labelConfirm">Confirmar contraseña</label>
        <input class="login-input" type="password" id="loginConfirm" name="confirm" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="login-btn" type="submit" id="loginBtn">Entrar al portal</button>
    </form>

    <div class="login-error" id="loginError"></div>

    <div class="login-toggle" id="toggleMode">
      <span id="toggleText">¿No tienes cuenta?</span> <a id="toggleLink" onclick="window.__dmfToggleMode()">Crear una</a>
    </div>
  </div>

  <div class="login-footer">
    <a href="/" data-i18n="back">← Volver a DMF</a><button class="dmf-lang-switch" type="button" data-lang-switch>English</button>
  </div>
</div>

<script>window.DMF_I18N.apply();</script>

<script src="/academy-env.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
var __dmfFirebaseReady = false;
if (window.__DMF_FIREBASE_CONFIG__) {
  try {
    if (typeof firebase !== 'undefined' && firebase.initializeApp) {
      firebase.initializeApp(window.__DMF_FIREBASE_CONFIG__);
      __dmfFirebaseReady = !!(firebase.apps && firebase.apps.length > 0 && firebase.auth);
    }
  } catch (e) {
    __dmfFirebaseReady = false;
  }
}
</script>
<script>
(function () {
  'use strict';

  var T = window.DMF_I18N.t;
  var DEMO_MODE = !!(window.__DMF_ACADEMY_DEMO__);
  var purchaseEnvironment = 'production';
  try {
    purchaseEnvironment = sessionStorage.getItem('dmf_purchase_environment') === 'sandbox' ? 'sandbox' : 'production';
  } catch (_) { /* ignore */ }
  var PAYMENTS_URL = purchaseEnvironment === 'sandbox'
    ? 'https://dmf-payments-sandbox.vibraalto-cl.workers.dev'
    : (window.__DMF_PAYMENTS_URL__ || 'https://dmf-payments.vibraalto-cl.workers.dev');
  var isSignUp = false;

  var demoBadge = document.getElementById('demoBadge');
  if (DEMO_MODE && demoBadge) demoBadge.style.display = 'flex';

  var form = document.getElementById('loginForm');
  var errorEl = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  var confirmField = document.getElementById('confirmField');
  var formTitle = document.getElementById('formTitle');
  var formSubtitle = document.getElementById('formSubtitle');
  var toggleText = document.getElementById('toggleText');
  var toggleLink = document.getElementById('toggleLink');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function hideError() {
    errorEl.style.display = 'none';
  }

  function updateMode() {
    hideError();
    if (isSignUp) {
      formTitle.textContent = T('titleSignup');
      formSubtitle.textContent = T('subSignup');
      btn.textContent = T('btnSignup');
      confirmField.style.display = 'block';
      document.getElementById('loginConfirm').required = true;
      toggleText.textContent = T('toLoginText');
      toggleLink.textContent = T('toLoginLink');
    } else {
      formTitle.textContent = T('titleLogin');
      formSubtitle.textContent = T('subLogin');
      btn.textContent = T('btnLogin');
      confirmField.style.display = 'none';
      document.getElementById('loginConfirm').required = false;
      toggleText.textContent = T('toSignupText');
      toggleLink.textContent = T('toSignupLink');
    }
  }

  window.__dmfToggleMode = function () {
    isSignUp = !isSignUp;
    updateMode();
  };

  try {
    var pending = sessionStorage.getItem('dmf_purchase_intent');
    if (pending) isSignUp = true;
  } catch (ex) { /* ignore */ }
  updateMode();

  function consumePurchaseIntent() {
    try {
      var intent = sessionStorage.getItem('dmf_purchase_intent');
      if (intent) {
        sessionStorage.removeItem('dmf_purchase_intent');
        return intent;
      }
    } catch (ex) { /* ignore */ }
    return null;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      showError(T('errMissing'));
      return;
    }

    if (isSignUp) {
      var confirm = document.getElementById('loginConfirm').value;
      if (password !== confirm) {
        showError(T('errMismatch'));
        return;
      }
      if (password.length < 6) {
        showError(T('errShort'));
        return;
      }
    }

    btn.disabled = true;
    btn.textContent = T('connecting');

    if (DEMO_MODE) {
      setTimeout(function () {
        try { sessionStorage.setItem('dmf_auth', JSON.stringify({ email: email, demo: true, ts: Date.now() })); } catch (ex) { /* ignore */ }
        consumePurchaseIntent();
        window.location.href = '/academy';
      }, 600);
      return;
    }

    if (!__dmfFirebaseReady) {
      btn.disabled = false;
      btn.textContent = isSignUp ? T('btnSignup') : T('btnLogin');
      showError(T('errNoAuth'));
      return;
    }

    var authPromise;
    if (isSignUp) {
      authPromise = firebase.auth().createUserWithEmailAndPassword(email, password);
    } else {
      authPromise = firebase.auth().signInWithEmailAndPassword(email, password);
    }

    authPromise
      .then(function () {
        var intent = consumePurchaseIntent();
        if (intent) {
          btn.textContent = T('redirecting');
          firebase.auth().currentUser.getIdToken()
            .then(function (idToken) {
              return fetch(PAYMENTS_URL + '/create-preference', {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + idToken,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ productId: intent })
              });
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.ok && data.init_point) {
                window.location.href = data.init_point;
              } else {
                window.location.href = '/academy';
              }
            })
            .catch(function () {
              window.location.href = '/academy';
            });
          return;
        }
        window.location.href = '/academy';
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = isSignUp ? T('btnSignup') : T('btnLogin');
        var msg = T('errInvalid');
        if (err.code === 'auth/too-many-requests') msg = T('errTooMany');
        else if (err.code === 'auth/invalid-email') msg = T('errBadEmail');
        else if (err.code === 'auth/email-already-in-use') msg = T('errInUse');
        else if (err.code === 'auth/weak-password') msg = T('errShort');
        showError(msg);
      });
  });
})();
</script>

</body>
</html>
