  var UI = {

      "invalidTitle": "Enlace no válido",

      "expiredTitle": "Sesión expirada",

      "pendingTitle": "Pago pendiente",

      "genericTitle": "Procesando",
      "genericMsg": "Tu pago se está procesando. Vuelve a revisar pronto.",
      "connTitle": "Problema de conexión",
      "connMsg": "No pudimos verificar el estado del pago. Revisa tu email o intenta entrar a la Academy más tarde.",
      "authTitle": "Inicio de sesión requerido",
      "configTitle": "Error de configuración",

      "back": "← Volver a DMF",

      "processingMsg": "Verifying your payment status. This may take a moment...",
      "checking": "Checking",
      "stApproved": "Approved",

      "stPending": "Pending",
      "activating": "Activating...",
      "btnEnter": "Enter Academy →",
      "btnRetry": "Try Again →",
      "btnBack": "Back to DMF →",
      "btnSignIn": "Sign In →",
      "invalidTitle": "Invalid Link",
      "invalidMsg": "This payment link is not valid. Please start a new purchase from the DMF website.",
      "expiredTitle": "Session Expired",
      "signInMsg": "Please sign in to view your payment status.",
      "inProcessTitle": "Payment Processing",
      "inProcessMsg": "Your payment is being processed. You will receive access once it is confirmed. Check back later.",
      "welcomeTitle": "Welcome to DMF Academy",
      "welcomeMsg": "Your payment has been confirmed and your account is now active. You can access the full training portal.",

      "declinedTitle": "Payment Declined",

      "pendingTitle": "Payment Pending",
      "pendingMsg": "Your payment is being reviewed. This can take a few minutes for some payment methods. We will activate your account once confirmed.",
      "genericTitle": "Processing",
      "genericMsg": "Your payment is being processed. Check back soon.",
      "connTitle": "Connection Issue",
      "connMsg": "Could not verify payment status. Please check your email or try accessing the academy later.",
      "authTitle": "Authentication Required",
      "configTitle": "Configuration Error",
      "configMsg": "Authentication service is not available. Please try again later.",
      "back": "← Back to DMF",
      "langSwitch": "Español",
      "langSwitchAria": "View this page in Spanish"
    }
  };
  function t(key) {
    if (Object.prototype.hasOwnProperty.call(UI[lang], key)) return UI[lang][key];
    return Object.prototype.hasOwnProperty.call(UI.es, key) ? UI.es[key] : key;
  }
  function apply() {
    var i, els = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute('data-i18n'));
    els = document.querySelectorAll('[data-i18n-placeholder]');
    for (i = 0; i < els.length; i++) els[i].setAttribute('placeholder', t(els[i].getAttribute('data-i18n-placeholder')));
    els = document.querySelectorAll('[data-lang-switch]');
    for (i = 0; i < els.length; i++) {
      els[i].textContent = t('langSwitch');
      els[i].setAttribute('aria-label', t('langSwitchAria'));
      els[i].setAttribute('lang', lang === 'es' ? 'en' : 'es');
      els[i].onclick = function () {
        try { localStorage.setItem('dmf_lang', lang === 'es' ? 'en' : 'es'); } catch (e) { /* ignore */ }
        window.location.reload();
      };
    }
    document.title = t('pageTitle');
  }
  return { lang: lang, t: t, apply: apply };
})();

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0a0806;color:#f2ede6;font-family:'Archivo',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
::selection{background:#ff5b1e;color:#0a0806}
a{color:#ff5b1e;text-decoration:none;transition:color .2s}
a:hover{color:#ff7a45}

.result-container{width:100%;max-width:520px;text-align:center}
.result-brand{margin-bottom:48px}
.result-brand-name{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:#f2ede6;margin-bottom:8px}
.result-brand-sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#ff5b1e}
.result-card{border:1px solid rgba(242,237,230,.1);padding:48px 32px;background:rgba(242,237,230,.02)}
.result-icon{font-size:48px;margin-bottom:20px}
.result-title{font-family:'Anton',sans-serif;font-size:28px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.result-msg{font-size:14px;color:#8a8178;line-height:1.7;margin-bottom:28px}
.result-status{display:inline-block;padding:8px 20px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:28px}
.result-status.polling{background:rgba(255,170,50,.1);border:1px solid rgba(255,170,50,.3);color:#ffaa32}
.result-status.approved{background:rgba(80,200,120,.1);border:1px solid rgba(80,200,120,.3);color:#50c878}
.result-status.rejected{background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.3);color:#ff6b6b}
.result-status.pending{background:rgba(255,170,50,.1);border:1px solid rgba(255,170,50,.3);color:#ffaa32}
.result-btn{display:inline-block;padding:16px 32px;font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#0a0806;background:#ff5b1e;border:none;cursor:pointer;transition:background .2s;text-decoration:none}
.result-btn:hover{background:#ff7a45;color:#0a0806}
.result-footer{text-align:center;margin-top:32px;font-size:12px;color:#665f58;letter-spacing:.04em}
.result-footer a{font-size:12px}
.dmf-lang-switch{background:none;border:0;padding:0;margin-left:18px;font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.04em;color:#8a8178;cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:color .2s}
.dmf-lang-switch:hover{color:#ff5b1e}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(255,170,50,.3);border-top-color:#ffaa32;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
</style>
</head>
<body>

<div class="result-container">
  <div class="result-brand">
    <div class="result-brand-name">Demian Muller</div>
    <div class="result-brand-sub">DMF Academy</div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="spinner" id="resultSpinner"></div>
    <div class="result-title" id="resultTitle" data-i18n="processingTitle">Procesando pago</div>
    <div class="result-msg" id="resultMsg" data-i18n="processingMsg">Estamos verificando el estado de tu pago. Esto puede tardar un momento…</div>
    <div class="result-status polling" id="resultStatus" data-i18n="checking">Verificando</div>
  </div>

  <div class="result-footer">
    <a href="/" data-i18n="back">← Volver a DMF</a><button class="dmf-lang-switch" type="button" data-lang-switch>English</button>
  </div>
</div>

<script>window.DMF_I18N.apply();</script>

<script src="/academy-env.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
(function () {
  'use strict';

  var T = window.DMF_I18N.t;
  var params = new URLSearchParams(window.location.search);
  var purchaseId = params.get('purchaseId');
  var paymentEnvironment = params.get('paymentEnvironment') === 'sandbox' ? 'sandbox' : 'production';
  var PAYMENTS_URL = paymentEnvironment === 'sandbox'
    ? 'https://dmf-payments-sandbox.vibraalto-cl.workers.dev'
    : (window.__DMF_PAYMENTS_URL__ || 'https://dmf-payments.vibraalto-cl.workers.dev');

  var titleEl = document.getElementById('resultTitle');
  var msgEl = document.getElementById('resultMsg');
  var statusEl = document.getElementById('resultStatus');
  var spinnerEl = document.getElementById('resultSpinner');
  var cardEl = document.getElementById('resultCard');

  function addButton(href, label, background) {
    var a = document.createElement('a');
    a.className = 'result-btn';
    a.href = href;
    a.style.marginTop = '12px';
    if (background) a.style.background = background;
    a.textContent = label;
    cardEl.appendChild(a);
  }

  function showState(state, title, msg) {
    spinnerEl.style.display = 'none';
    titleEl.textContent = title;
    msgEl.textContent = msg;
    statusEl.className = 'result-status ' + state;

    if (state === 'approved') {
      statusEl.textContent = T('stApproved');
      addButton('/academy', T('btnEnter'));
    } else if (state === 'rejected') {
      statusEl.textContent = T('stDeclined');
      addButton('/', T('btnRetry'));
    } else if (state === 'pending') {
      statusEl.textContent = T('stPending');
      addButton('/', T('btnBack'), '#665f58');
    }
  }

  if (!purchaseId) {
    showState('rejected', T('invalidTitle'), T('invalidMsg'));
    return;
  }

  if (window.__DMF_FIREBASE_CONFIG__) {
    try {
      if (typeof firebase !== 'undefined' && firebase.initializeApp) {
        firebase.initializeApp(window.__DMF_FIREBASE_CONFIG__);
      }
    } catch (e) { /* may already be initialized */ }
  }

  var attempts = 0;
  var maxAttempts = 20;
  var pollInterval = 3000;

  function poll() {
    attempts++;

    var user = typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser;
    if (!user) {
      showState('rejected', T('expiredTitle'), T('signInMsg'));
      addButton('/login', T('btnSignIn'), '#665f58');
      return;
    }

    user.getIdToken().then(function (idToken) {
      fetch(PAYMENTS_URL + '/check-status?purchaseId=' + encodeURIComponent(purchaseId), {
        headers: { 'Authorization': 'Bearer ' + idToken }
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.ok) {
            if (attempts < maxAttempts) {
              setTimeout(poll, pollInterval);
            } else {
              showState('pending', T('inProcessTitle'), T('inProcessMsg'));
            }
            return;
          }

          if (data.enrolled) {
            showState('approved', T('welcomeTitle'), T('welcomeMsg'));
            return;
          }

          if (data.status === 'approved') {
            if (attempts < maxAttempts) {
              statusEl.textContent = T('activating');
              setTimeout(poll, pollInterval);
            } else {
              showState('approved', T('confirmedTitle'), T('confirmedMsg'));
            }
            return;
          }

          if (data.status === 'rejected' || data.status === 'cancelled' || data.status === 'refunded') {
            showState('rejected', T('declinedTitle'), T('declinedMsg'));
            return;
          }

          if (data.status === 'pending' || data.status === 'in_process') {
            if (attempts < maxAttempts) {
              setTimeout(poll, pollInterval);
            } else {
              showState('pending', T('pendingTitle'), T('pendingMsg'));
            }
            return;
          }

          if (attempts < maxAttempts) {
            setTimeout(poll, pollInterval);
          } else {
            showState('pending', T('genericTitle'), T('genericMsg'));
          }
        })
        .catch(function () {
          if (attempts < maxAttempts) {
            setTimeout(poll, pollInterval);
          } else {
            showState('pending', T('connTitle'), T('connMsg'));
          }
        });
    });
  }

  if (typeof firebase !== 'undefined' && firebase.auth) {
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) {
        poll();
      } else {
        showState('rejected', T('authTitle'), T('signInMsg'));
        addButton('/login', T('btnSignIn'), '#665f58');
      }
    });
  } else {
    showState('rejected', T('configTitle'), T('configMsg'));
  }
})();
</script>

</body>
</html>
