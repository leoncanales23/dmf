name: Validate DMF Experience Stack

on:
  pull_request:
    paths:
      - 'scripts/build-3d.cjs'
      - 'scripts/inject-codex.cjs'
      - 'scripts/inject-oracle.cjs'
      - 'scripts/inject-transmission.cjs'
      - 'scripts/inject-compute-uplink.cjs'
      - 'scripts/inject-training-state.cjs'
      - 'scripts/check-3d.cjs'
      - 'scripts/verify-3d-checksum.cjs'
      - 'scripts/repair-geometry.cjs'
      - 'scripts/preflight-print.cjs'
      - 'scripts/inject-academy-link.cjs'
      - 'scripts/inject-academy-env.cjs'
      - 'functions/**'
      - 'workers/**'
      - 'assets/models/**'
      - 'index.html'
      - 'public/login.html'
      - 'public/academy.html'
      - 'public/academy-config.js'
      - 'public/payment-result.html'
      - 'firebase.json'
      - 'firebase.academy.json'
      - 'server.js'
      - 'firestore.rules'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-3d.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate optimized GLB payload
        run: |
          node scripts/check-3d.cjs
          node scripts/verify-3d-checksum.cjs

      - name: Validate DMF Training Function syntax
        run: node --check functions/index.js

      - name: Build full DMF experience stack
        run: |
          mkdir -p public/assets/models
          node scripts/build-3d.cjs
          node scripts/inject-codex.cjs
          node scripts/inject-oracle.cjs
          node scripts/inject-transmission.cjs
          node scripts/inject-compute-uplink.cjs
          node scripts/inject-training-state.cjs
          node scripts/inject-academy-link.cjs
          node scripts/inject-academy-env.cjs
          cat assets/models/dmf-signal.part0.b64 \
              assets/models/dmf-signal.part1.b64 \
              assets/models/dmf-signal.part2.b64 \
              assets/models/dmf-signal.part3.b64 \
            | base64 --decode > public/assets/models/dmf-signal-chrome.glb
          test -s public/assets/models/dmf-signal-chrome.glb
          grep -q 'DMF_MESHY_3D_HEAD' public/index.html
          grep -q 'dmf-signal-band' public/index.html
          grep -q 'The Receiver' public/index.html
          grep -q 'DMF_CODEX_HEAD' public/index.html
          grep -q 'dmf-initiation-protocol' public/index.html
          grep -q 'INITIATION PROTOCOL' public/index.html
          grep -q 'DMF_ORACLE_HEAD' public/index.html
          grep -q 'dmf-oracle' public/index.html
          grep -q 'THE FORMULA SPEAKS' public/index.html
          grep -q 'DMF_TRANSMISSION_HEAD' public/index.html
          grep -q 'dmf-transmission' public/index.html
          grep -q 'THE SYSTEM LISTENS' public/index.html
          grep -q 'DMF_COMPUTE_UPLINK_HEAD' public/index.html
          grep -q '/api/dmf/training' public/index.html
          grep -q 'VBC COMPUTE // SECURE UPLINK' public/index.html
          grep -q 'DMF_TRAINING_STATE_HEAD' public/index.html
          grep -q 'dmf-training-memory' public/index.html
          grep -q 'MEMORY CORE 11' public/index.html
          grep -q 'DMF_ACADEMY_LINK' public/index.html
          grep -q 'Student Access' public/index.html
          grep -q 'dmfTraining' firebase.json

  validate-academy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate academy files exist
        run: |
          test -f public/login.html
          test -f public/academy.html
          test -f public/academy-config.js
          echo "All academy files present."

      - name: Validate academy configuration
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('public/academy-config.js', 'utf8');

            const moduleCount = (src.match(/id: '[0-9]{2}'/g) || []).length;
            if (moduleCount !== 4) {
              console.error('Expected 4 published source modules, found ' + moduleCount);
              process.exit(1);
            }

            const streamKeys = [...src.matchAll(/streamKey:\s*'([^']+)'/g)].map(m => m[1]);
            const expected = [
              'intro-ableton-p1',
              'intro-ableton-p2',
              'clase1-kick-snare-hihat',
              'clase1-estructura',
              'clase1-bass-line',
              'clase1-loopcloud-intro',
              'clase2-top-loops',
              'clase2-synths-categorias',
              'clase2-percusion',
              'clase2-shakers-open-hihat',
              'clase3-edit-mix',
              'clase3-vocales',
              'clase3-compresion-rango-dinamico'
            ];

            if (JSON.stringify(streamKeys) !== JSON.stringify(expected)) {
              console.error('FAIL: DMF lesson order does not match Demian source order');
              console.error('Found: ' + JSON.stringify(streamKeys));
              process.exit(1);
            }

            console.log('Module count: 4 — OK');
            console.log('Demian lesson order: 13 lessons — OK');
          "

      - name: Validate no media stream files in repo
        run: |
          MEDIA=$(find . \( -name '*.m3u8' -o -name '*.mp4' -o -name '*.ts' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' \
            -not -path './public/uploads/*' || true)
          if [ -n "$MEDIA" ]; then
            echo "FAIL: Media/stream files found in repo:"
            echo "$MEDIA"
            exit 1
          fi
          echo "No media/stream files in repo — OK"

      - name: Validate no secrets in frontend
        run: |
          for f in public/login.html public/academy.html public/academy-config.js public/payment-result.html; do
            if grep -qi 'APP_USR\|accessToken\|service.account\|private_key' "$f"; then
              echo "FAIL: Possible secret found in $f"
              exit 1
            fi
          done
          echo "No secrets in frontend files — OK"

      - name: Validate Academy progress sync
        run: |
          grep -q "collection('progress').doc" public/academy.html || { echo "FAIL: Firestore progress collection not wired"; exit 1; }
          grep -q "dmf_progress_v3:" public/academy.html || { echo "FAIL: user-scoped local progress key missing"; exit 1; }
          grep -q "serverTimestamp()" public/academy.html || { echo "FAIL: progress server timestamp missing"; exit 1; }
          grep -q "firstIncomplete" public/academy.html || { echo "FAIL: resume-first-incomplete logic missing"; exit 1; }
          echo "Academy progress sync validated — OK"

      - name: Validate Adaptive Quality UX
        run: |
          node -e "
            const src = require('fs').readFileSync('public/academy.html', 'utf8');
            const checks = [
              ['QualityUX.attachHls present', src.includes('QualityUX.attachHls')],
              ['prefersNativeHls detection', src.includes('function prefersNativeHls')],
              ['prefersNativeHls guards native path', src.includes('prefersNativeHls()')],
              ['Hls.isSupported check', src.includes('Hls.isSupported()')],
              ['dmfQualityBadge element', src.includes('dmfQualityBadge')],
              ['dmfBuffering element', src.includes('dmfBuffering')],
              ['pointer-events:none on overlay', /\.dmf-buffering-overlay[^}]*pointer-events\s*:\s*none/.test(src)],
              ['Auto selector (currentLevel = -1)', src.includes('currentLevel = -1')],
              ['LEVEL_SWITCHED handler', src.includes('LEVEL_SWITCHED')],
            ];
            let fail = false;
            for (const [name, ok] of checks) {
              console.log((ok ? 'PASS' : 'FAIL') + ': ' + name);
              if (!ok) fail = true;
            }
            if (fail) process.exit(1);
            console.log('All ' + checks.length + '/' + checks.length + ' Adaptive Quality UX checks passed');
          "

      - name: Validate firebase.json academy rewrites
        run: |
          node -e "
            const cfg = require('./firebase.json');
            const rewrites = cfg.hosting.rewrites;
            const loginRewrite = rewrites.find(r => r.source === '/login');
            const academyRewrite = rewrites.find(r => r.source === '/academy');
            const academyWild = rewrites.find(r => r.source === '/academy/**');
            if (!loginRewrite) { console.error('Missing /login rewrite'); process.exit(1); }
            if (!academyRewrite) { console.error('Missing /academy rewrite'); process.exit(1); }
            if (!academyWild) { console.error('Missing /academy/** rewrite'); process.exit(1); }
            const catchAll = rewrites.findIndex(r => r.source === '**');
            const loginIdx = rewrites.indexOf(loginRewrite);
            if (loginIdx > catchAll) { console.error('/login rewrite must come before catch-all'); process.exit(1); }
            const paymentRewrite = rewrites.find(r => r.source === '/payment-result');
            if (!paymentRewrite) { console.error('Missing /payment-result rewrite'); process.exit(1); }
            const paymentIdx = rewrites.indexOf(paymentRewrite);
            if (paymentIdx > catchAll) { console.error('/payment-result rewrite must come before catch-all'); process.exit(1); }
            console.log('Firebase rewrites validated — OK');
          "

      - name: Validate HLS stream URLs are configurable
        run: |
          grep -q 'DMF_STREAM_BASE\|__DMF_STREAM_BASE__' public/academy-config.js
          echo "Stream URL configuration found — OK"

      - name: Validate Cloudflare Stream UID mapping
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('public/academy-config.js', 'utf8');

            // All 13 production lessons must have a real streamUid
            const uids = src.match(/streamUid:\s*'[a-f0-9]{32}'/g) || [];
            const pending = src.match(/streamUid:\s*null/g) || [];
            if (uids.length !== 13) {
              console.error('FAIL: Expected 13 streamUid mappings, found ' + uids.length);
              process.exit(1);
            }
            if (pending.length !== 0) {
              console.error('FAIL: Pending null streamUid mappings remain: ' + pending.length);
              process.exit(1);
            }
            console.log('Stream UIDs found: 13 — OK');
            console.log('Pending Stream UIDs: 0 — OK');

            // Manifest pattern must be present in getStreamUrl
            if (src.indexOf('/manifest/video.m3u8') === -1) {
              console.error('FAIL: /manifest/video.m3u8 pattern not found in getStreamUrl');
              process.exit(1);
            }
            console.log('Cloudflare manifest pattern present — OK');

            // No Cloudflare API tokens in frontend
            if (/cloudflare[-_]?(api|stream)[-_]?token/i.test(src)) {
              console.error('FAIL: Possible Cloudflare API token reference in academy-config.js');
              process.exit(1);
            }

            // No hardcoded customer-*.cloudflarestream.com
            if (/customer-[a-z0-9]+\.cloudflarestream\.com/i.test(src)) {
              console.error('FAIL: Hardcoded Cloudflare Stream domain in academy-config.js');
              process.exit(1);
            }
            console.log('No Cloudflare secrets or hardcoded domains — OK');
          "

      - name: Validate no Cloudflare secrets in frontend
        run: |
          for f in public/academy.html public/academy-config.js public/login.html public/payment-result.html; do
            if grep -qiE 'cloudflare[-_]?(api|stream)[-_]?token|customer-[a-z0-9]+\.cloudflarestream\.com' "$f"; then
              echo "FAIL: Cloudflare secret or hardcoded domain found in $f"
              exit 1
            fi
          done
          echo "No Cloudflare secrets in frontend files — OK"

      - name: Validate signed Stream playback (production)
        run: |
          # 1. Signer references present
          test -f workers/dmf-stream-signer/src/index.js || { echo "FAIL: Stream signer Worker missing"; exit 1; }
          test -f workers/dmf-stream-signer/wrangler.toml || { echo "FAIL: Stream signer Wrangler config missing"; exit 1; }
          grep -q "accounts:lookup" workers/dmf-stream-signer/src/index.js || { echo "FAIL: Firebase Auth REST validation missing"; exit 1; }
          grep -q "documents/enrollments/" workers/dmf-stream-signer/src/index.js || { echo "FAIL: enrollment validation missing"; exit 1; }
          grep -q "/stream/" workers/dmf-stream-signer/src/index.js || { echo "FAIL: Cloudflare Stream token API path missing"; exit 1; }
          grep -q "/token" workers/dmf-stream-signer/src/index.js || { echo "FAIL: Cloudflare token endpoint missing"; exit 1; }
          grep -q "__DMF_STREAM_SIGNER_URL__" public/academy.html || { echo "FAIL: signer URL reference missing in academy.html"; exit 1; }
          grep -q "__DMF_STREAM_SIGNER_URL__" scripts/inject-academy-env.cjs || { echo "FAIL: signer URL reference missing in inject script"; exit 1; }
          echo "1. Signer references present — OK"

          # 2. No fail-open fallback (production is fail-closed)
          if grep -q "Signed playback fallback" public/academy.html; then
            echo "FAIL: Stage 1 fail-open fallback still present in academy.html"
            exit 1
          fi
          if grep -q "return publicUrl" public/academy.html; then
            echo "FAIL: publicUrl fallback still present in academy.html"
            exit 1
          fi
          echo "2. No fail-open fallback — OK"

          # 3. No cfat_ tokens in source
          if grep -qi 'cfat_' public/academy.html public/academy-config.js workers/dmf-stream-signer/src/index.js; then
            echo "FAIL: Cloudflare API token prefix found in source"
            exit 1
          fi
          echo "3. No cfat_ tokens — OK"

          # 4. All 13 UIDs present
          node -e "
            const src = require('fs').readFileSync('public/academy-config.js', 'utf8');
            const uids = (src.match(/streamUid:\s*'[a-f0-9]{32}'/g) || []);
            if (uids.length !== 13) {
              console.error('FAIL: Expected 13 streamUid mappings, found ' + uids.length);
              process.exit(1);
            }
            console.log('4. All 13 UIDs present — OK');
          "

          # 5. All 13 UIDs unique (no duplicates)
          node -e "
            const src = require('fs').readFileSync('public/academy-config.js', 'utf8');
            const uids = (src.match(/streamUid:\s*'([a-f0-9]{32})'/g) || []).map(m => m.match(/'([a-f0-9]{32})'/)[1]);
            const unique = new Set(uids);
            if (unique.size !== 13) {
              console.error('FAIL: Expected 13 unique UIDs, found ' + unique.size + ' unique out of ' + uids.length);
              process.exit(1);
            }
            console.log('5. All 13 UIDs unique — OK');
          "

          # 6. No console.log/warn of signed tokens
          if grep -qE 'console\.(log|warn).*token' public/academy.html; then
            echo "FAIL: console output with token reference found in academy.html"
            exit 1
          fi
          echo "6. No console log/warn of tokens — OK"

          # 7. No localStorage of signed tokens
          if grep -q 'localStorage.*token\|token.*localStorage' public/academy.html; then
            echo "FAIL: localStorage token storage found in academy.html"
            exit 1
          fi
          echo "7. No localStorage of tokens — OK"

          # 8. No billing-dependent Firebase signer
          if grep -q "/api/dmf/stream-token" firebase.json; then
            echo "FAIL: billing-dependent Firebase signer rewrite must be removed"
            exit 1
          fi
          if grep -q "dmfStreamToken" functions/index.js; then
            echo "FAIL: billing-dependent Firebase signer function must be removed"
            exit 1
          fi
          echo "8. No billing-dependent Firebase signer — OK"

          # 9. Signed playback production documented
          grep -q "Signed Stream Playback — Production" docs/DMF_ACADEMY_V1.md || { echo "FAIL: Signed playback production not documented in DMF_ACADEMY_V1.md"; exit 1; }
          echo "9. Signed playback production documented — OK"

          # 10. Production status documented (13/13 protected)
          grep -q "requireSignedURLs: true" docs/DMF_ACADEMY_V1.md || { echo "FAIL: requireSignedURLs production status not documented"; exit 1; }
          echo "10. Production status documented — OK"

          # 11. Fail-closed playback verified in code
          node -e "
            const src = require('fs').readFileSync('public/academy.html', 'utf8');
            if (!/catch\(function\s*\(\)\s*\{\s*\n?\s*return null;/.test(src)) {
              console.error('FAIL: getAuthorizedStreamUrl must catch errors and return null (fail-closed)');
              process.exit(1);
            }
            console.log('11. Fail-closed error handling verified — OK');
          "

          # 12. Worker allowlist — STREAM_UIDS has exactly 13 entries
          node -e "
            const src = require('fs').readFileSync('workers/dmf-stream-signer/src/index.js', 'utf8');
            const uids = (src.match(/'[a-f0-9]{32}'/g) || []);
            if (uids.length !== 13) {
              console.error('FAIL: Worker STREAM_UIDS must have exactly 13 entries, found ' + uids.length);
              process.exit(1);
            }
            console.log('12. Worker allowlist has 13 UIDs — OK');
          "

          # 13. UID parity — academy-config.js streamUids === Worker STREAM_UIDS
          node -e "
            const fs = require('fs');
            const configSrc = fs.readFileSync('public/academy-config.js', 'utf8');
            const workerSrc = fs.readFileSync('workers/dmf-stream-signer/src/index.js', 'utf8');
            const configUids = new Set((configSrc.match(/streamUid:\s*'([a-f0-9]{32})'/g) || []).map(m => m.match(/'([a-f0-9]{32})'/)[1]));
            const workerUids = new Set((workerSrc.match(/'([a-f0-9]{32})'/g) || []).map(m => m.match(/'([a-f0-9]{32})'/)[1]));
            if (configUids.size !== 13) { console.error('FAIL: academy-config.js has ' + configUids.size + ' UIDs, expected 13'); process.exit(1); }
            if (workerUids.size !== 13) { console.error('FAIL: Worker has ' + workerUids.size + ' UIDs, expected 13'); process.exit(1); }
            const missingInWorker = [...configUids].filter(u => !workerUids.has(u));
            const extraInWorker = [...workerUids].filter(u => !configUids.has(u));
            if (missingInWorker.length > 0) { console.error('FAIL: UIDs in config but not in Worker: ' + missingInWorker.join(', ')); process.exit(1); }
            if (extraInWorker.length > 0) { console.error('FAIL: UIDs in Worker but not in config: ' + extraInWorker.join(', ')); process.exit(1); }
            console.log('13. UID parity: academy-config.js === Worker STREAM_UIDS (13/13) — OK');
          "

          # 14. Lesson order integrity — 4 modules with correct lesson counts
          node -e "
            const src = require('fs').readFileSync('public/academy-config.js', 'utf8');
            const moduleMatches = src.match(/lessons:\s*\[/g) || [];
            if (moduleMatches.length !== 4) { console.error('FAIL: Expected 4 modules, found ' + moduleMatches.length); process.exit(1); }
            const uidMatches = src.match(/streamUid:\s*'[a-f0-9]{32}'/g) || [];
            if (uidMatches.length !== 13) { console.error('FAIL: Expected 13 lessons with streamUid, found ' + uidMatches.length); process.exit(1); }
            console.log('14. Lesson order integrity: 4 modules, 13 lessons — OK');
          "

          # 15. No raw UID playback logic (no publicUrl fallback, no unsigned manifest construction)
          node -e "
            const src = require('fs').readFileSync('public/academy.html', 'utf8');
            if (src.indexOf('publicUrl') !== -1) { console.error('FAIL: publicUrl reference found in academy.html'); process.exit(1); }
            if (src.indexOf('Signed playback fallback') !== -1) { console.error('FAIL: Stage 1 fallback comment found'); process.exit(1); }
            if (/getStreamUrl\s*\(\s*lesson\.streamUid\s*\)/.test(src)) { console.error('FAIL: raw UID passed to getStreamUrl (must use signed token)'); process.exit(1); }
            console.log('15. No raw UID playback logic — OK');
          "

          echo "Signed Stream playback (production) validated — OK"

      - name: Validate signed playback acceptance tests
        run: |
          node -e "
            const fs = require('fs');
            const academy = fs.readFileSync('public/academy.html', 'utf8');
            const config = fs.readFileSync('public/academy-config.js', 'utf8');
            var passed = 0;

            // Test 1: Authorized student playback — signed token flow exists
            if (academy.indexOf('getAuthorizedStreamUrl') !== -1
                && academy.indexOf('/stream-token') !== -1
                && academy.indexOf('getIdToken') !== -1
                && academy.indexOf('Bearer') !== -1) {
              console.log('TEST 1 PASS: Authorized student signed playback flow present');
              passed++;
            } else {
              console.error('TEST 1 FAIL: Signed playback flow incomplete');
              process.exit(1);
            }

            // Test 2: Signed manifest URL used (token in getStreamUrl, not raw UID)
            if (academy.indexOf('getStreamUrl(payload.token)') !== -1) {
              console.log('TEST 2 PASS: Signed manifest URL constructed from token');
              passed++;
            } else {
              console.error('TEST 2 FAIL: getStreamUrl not called with signed token');
              process.exit(1);
            }

            // Test 3: Raw UID blocked — no publicUrl fallback, canary UID mapped
            if (academy.indexOf('return publicUrl') === -1
                && config.indexOf('9bb8ec71e5f2cf3054979e77b65c1bba') !== -1) {
              console.log('TEST 3 PASS: No publicUrl fallback, canary UID mapped');
              passed++;
            } else {
              console.error('TEST 3 FAIL: publicUrl fallback exists or canary UID missing');
              process.exit(1);
            }

            // Test 4: Unauthenticated rejected — currentUser check returns null
            if (academy.indexOf('firebase.auth().currentUser') !== -1
                && /if \(!user\) return Promise\.resolve\(null\)/.test(academy)) {
              console.log('TEST 4 PASS: Unauthenticated request returns null (no playback)');
              passed++;
            } else {
              console.error('TEST 4 FAIL: Missing unauthenticated rejection');
              process.exit(1);
            }

            // Test 5: No enrollment → signer rejects (403) — enrollment check in Worker
            var worker = fs.readFileSync('workers/dmf-stream-signer/src/index.js', 'utf8');
            if (worker.indexOf('enrollments') !== -1
                && worker.indexOf('403') !== -1) {
              console.log('TEST 5 PASS: Worker validates enrollment, returns 403 without it');
              passed++;
            } else {
              console.error('TEST 5 FAIL: Worker enrollment validation missing');
              process.exit(1);
            }

            console.log('All ' + passed + '/5 signed playback acceptance tests passed');
          "

      - name: Validate Firestore rules exist and are secure
        run: |
          test -f firestore.rules || { echo "FAIL: firestore.rules not found"; exit 1; }
          grep -q 'match /enrollments/{userId}' firestore.rules || { echo "FAIL: enrollments rule missing"; exit 1; }
          grep -q 'request.auth.uid == userId' firestore.rules || { echo "FAIL: uid check missing in rules"; exit 1; }
          grep -q 'allow create, update, delete: if false' firestore.rules || { echo "FAIL: enrollment client writes not denied"; exit 1; }
          grep -q 'match /progress/{userId}' firestore.rules || { echo "FAIL: progress rule missing"; exit 1; }
          grep -q 'hasActiveEnrollment(userId)' firestore.rules || { echo "FAIL: progress must require active enrollment"; exit 1; }
          grep -q "request.resource.data.version == 3" firestore.rules || { echo "FAIL: progress schema version guard missing"; exit 1; }
          grep -q "request.resource.data.updatedAt == request.time" firestore.rules || { echo "FAIL: progress server timestamp guard missing"; exit 1; }
          echo "Firestore rules validated — enrollment locked, progress user-scoped"

      - name: Validate firebase.academy.json exists and is correct
        run: |
          test -f firebase.academy.json || { echo "FAIL: firebase.academy.json not found"; exit 1; }
          node -e "
            const cfg = require('./firebase.academy.json');
            if (!cfg.firestore || !cfg.firestore.rules) {
              console.error('FAIL: firebase.academy.json must contain firestore.rules');
              process.exit(1);
            }
            if (cfg.hosting) { console.error('FAIL: firebase.academy.json must NOT contain hosting'); process.exit(1); }
            if (cfg.functions) { console.error('FAIL: firebase.academy.json must NOT contain functions'); process.exit(1); }
            if (cfg.storage) { console.error('FAIL: firebase.academy.json must NOT contain storage'); process.exit(1); }
            console.log('firebase.academy.json validated — Firestore only, OK');
          "

      - name: Validate firebase.json does not contain Firestore
        run: |
          node -e "
            const cfg = require('./firebase.json');
            if (cfg.firestore) {
              console.error('FAIL: firebase.json must NOT contain firestore config (use firebase.academy.json)');
              process.exit(1);
            }
            console.log('firebase.json has no Firestore config — OK');
          "

      - name: Validate .firebaserc points to hosting project
        run: |
          node -e "
            const rc = JSON.parse(require('fs').readFileSync('.firebaserc', 'utf8'));
            if (rc.projects.default !== 'vibraaltoai-11f55') {
              console.error('FAIL: .firebaserc default must be vibraaltoai-11f55, found: ' + rc.projects.default);
              process.exit(1);
            }
            console.log('.firebaserc default project: vibraaltoai-11f55 — OK');
          "

      - name: Validate docs reference firebase.academy.json and --project dmf-academy
        run: |
          grep -q 'firebase.academy.json' docs/DMF_ACADEMY_V1.md || { echo "FAIL: docs must reference firebase.academy.json"; exit 1; }
          grep -q '\-\-project dmf-academy' docs/DMF_ACADEMY_V1.md || { echo "FAIL: docs must reference --project dmf-academy"; exit 1; }
          grep -q 'dmf-academy' docs/DMF_ACADEMY_V1.md || { echo "FAIL: docs must reference dmf-academy project"; exit 1; }
          echo "Docs reference firebase.academy.json and dmf-academy — OK"

      - name: Validate deploy.yml does not deploy Firestore
        run: |
          if grep -qE 'firebase\.academy\.json|--only.*firestore' .github/workflows/deploy.yml; then
            echo "FAIL: deploy.yml must not deploy Firestore or reference firebase.academy.json"
            exit 1
          fi
          echo "deploy.yml does not deploy Firestore — OK"

      - name: Validate no workflow deploys Firestore without --project dmf-academy
        run: |
          for wf in .github/workflows/*.yml; do
            if grep -q 'firestore' "$wf" 2>/dev/null; then
              if echo "$wf" | grep -q 'validate-3d.yml'; then continue; fi
              if grep -qE 'firebase deploy.*firestore' "$wf" && ! grep -qE '\-\-project dmf-academy' "$wf"; then
                echo "FAIL: $wf deploys Firestore without --project dmf-academy"
                exit 1
              fi
            fi
          done
          echo "No workflow deploys Firestore without --project dmf-academy — OK"

      - name: Validate no Auth/Firestore configured toward hosting project
        run: |
          node -e "
            const fs = require('fs');
            const files = ['public/academy.html', 'public/academy-config.js', 'public/login.html', 'public/payment-result.html', 'scripts/inject-academy-env.cjs'];
            for (const f of files) {
              const src = fs.readFileSync(f, 'utf8');
              if (/vibraaltoai-11f55/.test(src)) {
                console.error('FAIL: ' + f + ' references vibraaltoai-11f55 (hosting project)');
                process.exit(1);
              }
            }
            console.log('No frontend/script files reference hosting project — OK');
          "

      - name: Validate login does not allow demo via query string
        run: |
          if grep -q 'demo=true' public/login.html; then
            echo "FAIL: login.html still allows demo activation via query string"
            exit 1
          fi
          echo "No query-string demo activation in login — OK"

      - name: Validate no service accounts or admin credentials in public
        run: |
          for f in public/login.html public/academy.html public/academy-config.js public/payment-result.html; do
            if grep -qiE 'service[_-]?account|admin[_-]?sdk|firebase[_-]?admin|FIREBASE_TOKEN' "$f"; then
              echo "FAIL: Possible admin credential reference in $f"
              exit 1
            fi
          done
          echo "No admin credentials in frontend files — OK"

      - name: Validate Mercado Pago payments Worker
        run: |
          # 1. Worker files exist
          test -f workers/dmf-payments/src/index.js || { echo "FAIL: Payments Worker missing"; exit 1; }
          test -f workers/dmf-payments/wrangler.toml || { echo "FAIL: Payments Wrangler config missing"; exit 1; }
          echo "1. Payments Worker files present — OK"

          # 2. Worker validates Firebase Auth
          grep -q "accounts:lookup" workers/dmf-payments/src/index.js || { echo "FAIL: Firebase Auth validation missing in payments Worker"; exit 1; }
          echo "2. Firebase Auth validation in payments Worker — OK"

          # 3. Worker HMAC webhook verification
          grep -q "HMAC" workers/dmf-payments/src/index.js || { echo "FAIL: HMAC webhook verification missing"; exit 1; }
          grep -q "x-signature" workers/dmf-payments/src/index.js || { echo "FAIL: x-signature header check missing"; exit 1; }
          echo "3. Webhook HMAC verification — OK"

          # 4. Worker verifies payment via API (not trusting webhook body)
          grep -q "api.mercadopago.com/v1/payments/" workers/dmf-payments/src/index.js || { echo "FAIL: Direct payment verification API call missing"; exit 1; }
          echo "4. Direct payment verification — OK"

          # 5. Idempotent processing (payments collection check)
          grep -q "'payments'" workers/dmf-payments/src/index.js || { echo "FAIL: Idempotent payment check missing"; exit 1; }
          echo "5. Idempotent payment processing — OK"

          # 6. Enrollment activation via Firestore
          grep -q "'enrollments'" workers/dmf-payments/src/index.js || { echo "FAIL: Enrollment activation missing in payments Worker"; exit 1; }
          echo "6. Enrollment activation — OK"

          # 7. Service account OAuth (not client credentials in frontend)
          grep -q "getServiceAccountToken" workers/dmf-payments/src/index.js || { echo "FAIL: Service account token function missing"; exit 1; }
          grep -q "googleapis.com/auth/datastore" workers/dmf-payments/src/index.js || { echo "FAIL: Datastore scope missing"; exit 1; }
          echo "7. Service account OAuth — OK"

          # 8. Products defined server-side only
          node -e "
            const src = require('fs').readFileSync('workers/dmf-payments/src/index.js', 'utf8');
            const products = ['starter', 'pro', 'elite', 'addon'];
            for (const p of products) {
              if (src.indexOf(p + ':') === -1 && src.indexOf(p + ' :') === -1) {
                console.error('FAIL: Product ' + p + ' not defined in Worker');
                process.exit(1);
              }
            }
            if (src.includes('247') && src.includes('497') && src.includes('997') && /price:\s*80/.test(src)) {
              console.log('8. Products defined server-side with correct prices — OK');
            } else {
              console.error('FAIL: Product prices not found in Worker');
              process.exit(1);
            }
          "

          # 9. No MP_ACCESS_TOKEN in frontend
          for f in public/index.html public/login.html public/academy.html public/payment-result.html; do
            if grep -qi 'MP_ACCESS_TOKEN\|MP_WEBHOOK_SECRET\|DMF_FIREBASE_PRIVATE_KEY' "$f"; then
              echo "FAIL: Payment secret reference found in $f"
              exit 1
            fi
          done
          echo "9. No payment secrets in frontend — OK"

          # 10. CORS origin allowlist in payments Worker
          grep -q "dmf.vibraalto.cl" workers/dmf-payments/src/index.js || { echo "FAIL: Production origin missing from payments CORS"; exit 1; }
          echo "10. CORS origin allowlist — OK"

          # 11. Payment result page exists and polls
          test -f public/payment-result.html || { echo "FAIL: payment-result.html missing"; exit 1; }
          grep -q "check-status" public/payment-result.html || { echo "FAIL: Status polling missing in payment-result.html"; exit 1; }
          echo "11. Payment result page with polling — OK"

          # 12. Payment result does NOT grant access from URL params
          node -e "
            const src = require('fs').readFileSync('public/payment-result.html', 'utf8');
            if (/status=approved/.test(src) && /enrolled/.test(src)) {
              if (src.indexOf('data.enrolled') !== -1 || src.indexOf('data.status') !== -1) {
                console.log('12. Payment result uses server-verified status — OK');
              } else {
                console.error('FAIL: payment-result may trust URL params for access');
                process.exit(1);
              }
            } else {
              console.log('12. Payment result does not use URL status param — OK');
            }
          "

          # 13. Checkout redirects to Worker, not Express
          node -e "
            const src = require('fs').readFileSync('public/index.html', 'utf8');
            if (src.indexOf('__DMF_PAYMENTS_URL__') !== -1 || src.indexOf('dmf-payments') !== -1) {
              console.log('13. Checkout uses Worker endpoint — OK');
            } else {
              console.error('FAIL: Checkout does not reference payments Worker');
              process.exit(1);
            }
          "

          # 14. inject-academy-env handles DMF_PAYMENTS_URL
          grep -q "DMF_PAYMENTS_URL" scripts/inject-academy-env.cjs || { echo "FAIL: DMF_PAYMENTS_URL missing from inject script"; exit 1; }
          grep -q "__DMF_PAYMENTS_URL__" scripts/inject-academy-env.cjs || { echo "FAIL: __DMF_PAYMENTS_URL__ window var missing from inject script"; exit 1; }
          echo "14. DMF_PAYMENTS_URL in inject script — OK"

          # 15. Login supports account creation
          grep -q "createUserWithEmailAndPassword" public/login.html || { echo "FAIL: Account creation missing from login"; exit 1; }
          echo "15. Account creation in login — OK"

          # 16. Firestore rules deny client writes on payment collections
          grep -q "checkoutSessions" firestore.rules || { echo "FAIL: checkoutSessions rule missing"; exit 1; }
          grep -q "payments" firestore.rules || { echo "FAIL: payments rule missing"; exit 1; }
          echo "16. Payment collection rules — OK"

          # 17. PEM header uses PKCS#8 format (not RSA)
          node -e "
            const src = require('fs').readFileSync('workers/dmf-payments/src/index.js', 'utf8');
            if (src.includes('RSA PRIVATE KEY')) {
              console.error('FAIL: Worker uses RSA PRIVATE KEY header instead of PRIVATE KEY (PKCS#8)');
              process.exit(1);
            }
            if (!src.includes('BEGIN PRIVATE KEY')) {
              console.error('FAIL: PKCS#8 PEM parsing missing');
              process.exit(1);
            }
            console.log('17. Correct PKCS#8 PEM header — OK');
          "

          # 18. Webhook uses signed dataId (not body)
          grep -q "signatureResult.dataId" workers/dmf-payments/src/index.js || { echo "FAIL: Webhook must use signed dataId from signature verification"; exit 1; }
          echo "18. Webhook uses signed dataId — OK"

          # 19. Webhook timestamp replay protection
          grep -q "tsAge" workers/dmf-payments/src/index.js || { echo "FAIL: Webhook timestamp age check missing"; exit 1; }
          echo "19. Webhook replay protection — OK"

          # 20. Amount/currency verification before enrollment
          grep -q "expectedAmount" workers/dmf-payments/src/index.js || { echo "FAIL: Amount verification missing before enrollment"; exit 1; }
          grep -q "expectedCurrency" workers/dmf-payments/src/index.js || { echo "FAIL: Currency verification missing before enrollment"; exit 1; }
          echo "20. Amount/currency verification — OK"

          # 21. check-status requires Firebase authentication
          node -e "
            const src = require('fs').readFileSync('workers/dmf-payments/src/index.js', 'utf8');
            const fn = src.substring(src.indexOf('handleCheckStatus'));
            if (!fn.includes('verifyFirebaseUser')) {
              console.error('FAIL: /check-status must verify Firebase ID token');
              process.exit(1);
            }
            if (!fn.includes('user.uid')) {
              console.error('FAIL: /check-status must verify session ownership');
              process.exit(1);
            }
            console.log('21. Authenticated check-status with uid verification — OK');
          "

          # 22. Payment result page sends auth token
          grep -q "Authorization" public/payment-result.html || { echo "FAIL: payment-result.html must send Authorization header"; exit 1; }
          grep -q "getIdToken" public/payment-result.html || { echo "FAIL: payment-result.html must get Firebase ID token"; exit 1; }
          echo "22. Authenticated payment result polling — OK"

          echo "All 22 Mercado Pago payments checks passed"

      - name: Validate merge-safe Firestore writes
        run: |
          node workers/dmf-payments/test/merge-safe.test.cjs

  validate-print:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run print preflight analysis
        run: node scripts/preflight-print.cjs

      - name: Run geometry repair pipeline
        run: node scripts/repair-geometry.cjs

      - name: Validate geometry gate
        run: |
          GATE=assets/models/GEOMETRY_GATE.json
          test -f "$GATE"
          node -e "
            const g = require('./' + process.argv[1]);
            const checks = [
              ['boundary',                g.boundary === 0,                             g.boundary],
              ['nonManifold',             g.nonManifold === 0,                           g.nonManifold],
              ['degenerate',              g.degenerate === 0,                            g.degenerate],
              ['components',              g.components === 1,                            g.components],
              ['watertight',              g.watertight === true,                         g.watertight],
              ['normalsOutward',          g.normalsOutward === true,                     g.normalsOutward],
              ['heightMM',                g.heightMM <= 200,                             g.heightMM],
              ['widthMM',                 g.widthMM <= 200,                              g.widthMM],
              ['depthMM',                 g.depthMM <= 200,                              g.depthMM],
              ['volumeCM3',               g.volumeCM3 > 0,                               g.volumeCM3],
              ['hollowReductionPct',      g.hollowReductionPct >= 50,                    g.hollowReductionPct],
              ['shellThicknessMM',        g.shellThicknessMM >= 1.5,                     g.shellThicknessMM],
              ['drainCount',              g.drainCount >= 2,                             g.drainCount],
              ['sealedCavityCount',       g.sealedCavityCount === 0,                     g.sealedCavityCount],
              ['drainReachableVolumePct', g.drainReachableVolumePct === 100,             g.drainReachableVolumePct],
              ['stlSHA256',               typeof g.stlSHA256 === 'string' && g.stlSHA256.length === 64, g.stlSHA256],
              ['threemfSHA256',           typeof g.threemfSHA256 === 'string' && g.threemfSHA256.length === 64, g.threemfSHA256],
              ['fidelityP95MM',          g.fidelityP95MM <= g.fidelityThresholdP95MM,   g.fidelityP95MM + ' <= ' + g.fidelityThresholdP95MM],
              ['removedPct',             g.removedPct <= g.removedThresholdPct,          g.removedPct + '% <= ' + g.removedThresholdPct + '%'],
              ['pass',                    g.pass === true,                               g.pass],
            ];
            let ok = true;
            for (const [k, pass, val] of checks) {
              console.log(pass ? 'PASS' : 'FAIL', k, '=', val);
              if (!pass) ok = false;
            }
            if (!ok) { console.error('GATE FAILED'); process.exit(1); }
            console.log('ALL GATES PASSED');
          " "$GATE"

      - name: Validate STL and 3MF exist and are non-trivial
        run: |
          STL=assets/models/DMF_RELIC_01_ALPHA.stl
          test -f "$STL"
          SIZE=$(stat -c%s "$STL")
          test "$SIZE" -gt 1000000
          echo "STL size: ${SIZE} bytes — OK"
          THREEMF=assets/models/DMF_RELIC_01.3mf
          test -f "$THREEMF"
          TMFSIZE=$(stat -c%s "$THREEMF")
          test "$TMFSIZE" -gt 100000
          echo "3MF size: ${TMFSIZE} bytes — OK"

      - name: Validate 3MF structure
        run: |
          THREEMF=assets/models/DMF_RELIC_01.3mf
          echo "Checking ZIP integrity..."
          unzip -t "$THREEMF"
          echo ""
          echo "Checking required entries..."
          unzip -l "$THREEMF" | grep -q '\[Content_Types\].xml'
          unzip -l "$THREEMF" | grep -q '_rels/.rels'
          unzip -l "$THREEMF" | grep -q '3D/3dmodel.model'
          echo "All required entries present."
          echo ""
          echo "Checking XML well-formedness..."
          unzip -p "$THREEMF" '3D/3dmodel.model' | node -e "
            const data = require('fs').readFileSync('/dev/stdin', 'utf8');
            if (!data.includes('<model')) { console.error('Missing <model> root'); process.exit(1); }
            if (!data.includes('<vertices>')) { console.error('Missing <vertices>'); process.exit(1); }
            if (!data.includes('<triangles>')) { console.error('Missing <triangles>'); process.exit(1); }
            if (!data.includes('unit=\"millimeter\"')) { console.error('Missing unit=millimeter'); process.exit(1); }
            const vCount = (data.match(/<vertex /g) || []).length;
            const tCount = (data.match(/<triangle /g) || []).length;
            if (vCount < 1000) { console.error('Too few vertices: ' + vCount); process.exit(1); }
            if (tCount < 1000) { console.error('Too few triangles: ' + tCount); process.exit(1); }
            console.log('3MF model: ' + vCount + ' vertices, ' + tCount + ' triangles');
            console.log('XML structure valid.');
          "

      - name: Verify STL + 3MF reproducibility (SHA-256)
        run: |
          EXPECTED_STL=$(node -e "const g=require('./assets/models/GEOMETRY_GATE.json'); console.log(g.stlSHA256)")
          ACTUAL_STL=$(sha256sum assets/models/DMF_RELIC_01_ALPHA.stl | cut -d' ' -f1)
          if [ "$EXPECTED_STL" != "$ACTUAL_STL" ]; then
            echo "FAIL: STL SHA-256 mismatch"
            echo "  Expected: $EXPECTED_STL"
            echo "  Actual:   $ACTUAL_STL"
            exit 1
          fi
          echo "STL SHA-256 verified: $ACTUAL_STL"
          EXPECTED_3MF=$(node -e "const g=require('./assets/models/GEOMETRY_GATE.json'); console.log(g.threemfSHA256)")
          ACTUAL_3MF=$(sha256sum assets/models/DMF_RELIC_01.3mf | cut -d' ' -f1)
          if [ "$EXPECTED_3MF" != "$ACTUAL_3MF" ]; then
            echo "FAIL: 3MF SHA-256 mismatch"
            echo "  Expected: $EXPECTED_3MF"
            echo "  Actual:   $ACTUAL_3MF"
            exit 1
          fi
          echo "3MF SHA-256 verified: $ACTUAL_3MF"

      - name: Verify pipeline reproducibility
        run: |
          echo "Checking GEOMETRY_GATE.json matches committed version..."
          git diff --exit-code assets/models/GEOMETRY_GATE.json || {
            echo "FAIL: GEOMETRY_GATE.json differs from committed version"
            echo "The repair pipeline is not reproducible — committed gate does not match regenerated."
            exit 1
          }
          echo "Checking PRINT_PREFLIGHT_REPORT.md matches committed version..."
          git diff --exit-code assets/models/PRINT_PREFLIGHT_REPORT.md || {
            echo "FAIL: PRINT_PREFLIGHT_REPORT.md differs from committed version"
            exit 1
          }
          echo "Pipeline reproducibility verified — committed artifacts match regenerated."
