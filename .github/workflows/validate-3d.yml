name: Validate DMF Experience Stack

on:
  pull_request:
    paths:
      - 'scripts/build-3d.cjs'
      - 'scripts/inject-codex.cjs'
      - 'scripts/inject-oracle.cjs'
      - 'scripts/inject-transmission.cjs'
      - 'scripts/inject-compute-uplink.cjs'
      - 'scripts/inject-training-state.cjs'
      - 'scripts/check-3d.cjs'
      - 'scripts/verify-3d-checksum.cjs'
      - 'scripts/repair-geometry.cjs'
      - 'scripts/preflight-print.cjs'
      - 'scripts/inject-academy-link.cjs'
      - 'scripts/inject-academy-env.cjs'
      - 'functions/**'
      - 'assets/models/**'
      - 'index.html'
      - 'public/login.html'
      - 'public/academy.html'
      - 'public/academy-config.js'
      - 'firebase.json'
      - 'firebase.academy.json'
      - 'server.js'
      - 'firestore.rules'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-3d.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate optimized GLB payload
        run: |
          node scripts/check-3d.cjs
          node scripts/verify-3d-checksum.cjs

      - name: Validate DMF Training Function syntax
        run: node --check functions/index.js

      - name: Build full DMF experience stack
        run: |
          mkdir -p public/assets/models
          node scripts/build-3d.cjs
          node scripts/inject-codex.cjs
          node scripts/inject-oracle.cjs
          node scripts/inject-transmission.cjs
          node scripts/inject-compute-uplink.cjs
          node scripts/inject-training-state.cjs
          node scripts/inject-academy-link.cjs
          node scripts/inject-academy-env.cjs
          cat assets/models/dmf-signal.part0.b64 \
              assets/models/dmf-signal.part1.b64 \
              assets/models/dmf-signal.part2.b64 \
              assets/models/dmf-signal.part3.b64 \
            | base64 --decode > public/assets/models/dmf-signal-chrome.glb
          test -s public/assets/models/dmf-signal-chrome.glb
          grep -q 'DMF_MESHY_3D_HEAD' public/index.html
          grep -q 'dmf-signal-band' public/index.html
          grep -q 'The Receiver' public/index.html
          grep -q 'DMF_CODEX_HEAD' public/index.html
          grep -q 'dmf-initiation-protocol' public/index.html
          grep -q 'INITIATION PROTOCOL' public/index.html
          grep -q 'DMF_ORACLE_HEAD' public/index.html
          grep -q 'dmf-oracle' public/index.html
          grep -q 'THE FORMULA SPEAKS' public/index.html
          grep -q 'DMF_TRANSMISSION_HEAD' public/index.html
          grep -q 'dmf-transmission' public/index.html
          grep -q 'THE SYSTEM LISTENS' public/index.html
          grep -q 'DMF_COMPUTE_UPLINK_HEAD' public/index.html
          grep -q '/api/dmf/training' public/index.html
          grep -q 'VBC COMPUTE // SECURE UPLINK' public/index.html
          grep -q 'DMF_TRAINING_STATE_HEAD' public/index.html
          grep -q 'dmf-training-memory' public/index.html
          grep -q 'MEMORY CORE 11' public/index.html
          grep -q 'DMF_ACADEMY_LINK' public/index.html
          grep -q 'Student Access' public/index.html
          grep -q 'dmfTraining' firebase.json

  validate-academy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate academy files exist
        run: |
          test -f public/login.html
          test -f public/academy.html
          test -f public/academy-config.js
          echo "All academy files present."

      - name: Validate academy configuration
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('public/academy-config.js', 'utf8');

            const moduleCount = (src.match(/id: '[0-9]{2}'/g) || []).length;
            if (moduleCount !== 4) {
              console.error('Expected 4 published source modules, found ' + moduleCount);
              process.exit(1);
            }

            const streamKeys = [...src.matchAll(/streamKey:\s*'([^']+)'/g)].map(m => m[1]);
            const expected = [
              'intro-ableton-p1',
              'intro-ableton-p2',
              'clase1-kick-snare-hihat',
              'clase1-estructura',
              'clase1-bass-line',
              'clase1-loopcloud-intro',
              'clase2-top-loops',
              'clase2-synths-categorias',
              'clase2-percusion',
              'clase2-shakers-open-hihat',
              'clase3-edit-mix',
              'clase3-vocales',
              'clase3-compresion-rango-dinamico'
            ];

            if (JSON.stringify(streamKeys) !== JSON.stringify(expected)) {
              console.error('FAIL: DMF lesson order does not match Demian source order');
              console.error('Found: ' + JSON.stringify(streamKeys));
              process.exit(1);
            }

            console.log('Module count: 4 — OK');
            console.log('Demian lesson order: 13 lessons — OK');
          "

      - name: Validate no media stream files in repo
        run: |
          MEDIA=$(find . \( -name '*.m3u8' -o -name '*.mp4' -o -name '*.ts' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' \
            -not -path './public/uploads/*' || true)
          if [ -n "$MEDIA" ]; then
            echo "FAIL: Media/stream files found in repo:"
            echo "$MEDIA"
            exit 1
          fi
          echo "No media/stream files in repo — OK"

      - name: Validate no secrets in frontend
        run: |
          for f in public/login.html public/academy.html public/academy-config.js; do
            if grep -qi 'APP_USR\|accessToken\|service.account\|private_key' "$f"; then
              echo "FAIL: Possible secret found in $f"
              exit 1
            fi
          done
          echo "No secrets in frontend files — OK"

      - name: Validate firebase.json academy rewrites
        run: |
          node -e "
            const cfg = require('./firebase.json');
            const rewrites = cfg.hosting.rewrites;
            const loginRewrite = rewrites.find(r => r.source === '/login');
            const academyRewrite = rewrites.find(r => r.source === '/academy');
            const academyWild = rewrites.find(r => r.source === '/academy/**');
            if (!loginRewrite) { console.error('Missing /login rewrite'); process.exit(1); }
            if (!academyRewrite) { console.error('Missing /academy rewrite'); process.exit(1); }
            if (!academyWild) { console.error('Missing /academy/** rewrite'); process.exit(1); }
            const catchAll = rewrites.findIndex(r => r.source === '**');
            const loginIdx = rewrites.indexOf(loginRewrite);
            if (loginIdx > catchAll) { console.error('/login rewrite must come before catch-all'); process.exit(1); }
            console.log('Firebase rewrites validated — OK');
          "

      - name: Validate HLS stream URLs are configurable
        run: |
          grep -q 'DMF_STREAM_BASE\|__DMF_STREAM_BASE__' public/academy-config.js
          echo "Stream URL configuration found — OK"

      - name: Validate Cloudflare Stream UID mapping
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('public/academy-config.js', 'utf8');

            // At least one real streamUid must exist
            const uids = src.match(/streamUid:\s*'[a-f0-9]{32}'/g) || [];
            if (uids.length === 0) { console.error('FAIL: No streamUid mapped in academy-config.js'); process.exit(1); }
            console.log('Stream UIDs found: ' + uids.length + ' — OK');

            // Manifest pattern must be present in getStreamUrl
            if (src.indexOf('/manifest/video.m3u8') === -1) {
              console.error('FAIL: /manifest/video.m3u8 pattern not found in getStreamUrl');
              process.exit(1);
            }
            console.log('Cloudflare manifest pattern present — OK');

            // No Cloudflare API tokens in frontend
            if (/cloudflare[-_]?(api|stream)[-_]?token/i.test(src)) {
              console.error('FAIL: Possible Cloudflare API token reference in academy-config.js');
              process.exit(1);
            }

            // No hardcoded customer-*.cloudflarestream.com
            if (/customer-[a-z0-9]+\.cloudflarestream\.com/i.test(src)) {
              console.error('FAIL: Hardcoded Cloudflare Stream domain in academy-config.js');
              process.exit(1);
            }
            console.log('No Cloudflare secrets or hardcoded domains — OK');
          "

      - name: Validate no Cloudflare secrets in frontend
        run: |
          for f in public/academy.html public/academy-config.js public/login.html; do
            if grep -qiE 'cloudflare[-_]?(api|stream)[-_]?token|customer-[a-z0-9]+\.cloudflarestream\.com' "$f"; then
              echo "FAIL: Cloudflare secret or hardcoded domain found in $f"
              exit 1
            fi
          done
          echo "No Cloudflare secrets in frontend files — OK"

      - name: Validate Firestore rules exist and are secure
        run: |
          test -f firestore.rules || { echo "FAIL: firestore.rules not found"; exit 1; }
          grep -q 'match /enrollments/{userId}' firestore.rules || { echo "FAIL: enrollments rule missing"; exit 1; }
          grep -q 'request.auth.uid == userId' firestore.rules || { echo "FAIL: uid check missing in rules"; exit 1; }
          grep -q 'allow create, update, delete: if false' firestore.rules || { echo "FAIL: client writes not denied"; exit 1; }
          echo "Firestore rules validated — OK"

      - name: Validate firebase.academy.json exists and is correct
        run: |
          test -f firebase.academy.json || { echo "FAIL: firebase.academy.json not found"; exit 1; }
          node -e "
            const cfg = require('./firebase.academy.json');
            if (!cfg.firestore || !cfg.firestore.rules) {
              console.error('FAIL: firebase.academy.json must contain firestore.rules');
              process.exit(1);
            }
            if (cfg.hosting) { console.error('FAIL: firebase.academy.json must NOT contain hosting'); process.exit(1); }
            if (cfg.functions) { console.error('FAIL: firebase.academy.json must NOT contain functions'); process.exit(1); }
            if (cfg.storage) { console.error('FAIL: firebase.academy.json must NOT contain storage'); process.exit(1); }
            console.log('firebase.academy.json validated — Firestore only, OK');
          "

      - name: Validate firebase.json does not contain Firestore
        run: |
          node -e "
            const cfg = require('./firebase.json');
            if (cfg.firestore) {
              console.error('FAIL: firebase.json must NOT contain firestore config (use firebase.academy.json)');
              process.exit(1);
            }
            console.log('firebase.json has no Firestore config — OK');
          "

      - name: Validate .firebaserc points to hosting project
        run: |
          node -e "
            const rc = JSON.parse(require('fs').readFileSync('.firebaserc', 'utf8'));
            if (rc.projects.default !== 'vibraaltoai-11f55') {
              console.error('FAIL: .firebaserc default must be vibraaltoai-11f55, found: ' + rc.projects.default);
              process.exit(1);
            }
            console.log('.firebaserc default project: vibraaltoai-11f55 — OK');
          "

      - name: Validate docs reference firebase.academy.json and --project dmf-academy
        run: |
          grep -q 'firebase.academy.json' docs/DMF_ACADEMY_V1.md || { echo "FAIL: docs must reference firebase.academy.json"; exit 1; }
          grep -q '\-\-project dmf-academy' docs/DMF_ACADEMY_V1.md || { echo "FAIL: docs must reference --project dmf-academy"; exit 1; }
          grep -q 'dmf-academy' docs/DMF_ACADEMY_V1.md || { echo "FAIL: docs must reference dmf-academy project"; exit 1; }
          echo "Docs reference firebase.academy.json and dmf-academy — OK"

      - name: Validate deploy.yml does not deploy Firestore
        run: |
          if grep -qE 'firebase\.academy\.json|--only.*firestore' .github/workflows/deploy.yml; then
            echo "FAIL: deploy.yml must not deploy Firestore or reference firebase.academy.json"
            exit 1
          fi
          echo "deploy.yml does not deploy Firestore — OK"

      - name: Validate no workflow deploys Firestore without --project dmf-academy
        run: |
          for wf in .github/workflows/*.yml; do
            if grep -q 'firestore' "$wf" 2>/dev/null; then
              if echo "$wf" | grep -q 'validate-3d.yml'; then continue; fi
              if grep -qE 'firebase deploy.*firestore' "$wf" && ! grep -qE '\-\-project dmf-academy' "$wf"; then
                echo "FAIL: $wf deploys Firestore without --project dmf-academy"
                exit 1
              fi
            fi
          done
          echo "No workflow deploys Firestore without --project dmf-academy — OK"

      - name: Validate no Auth/Firestore configured toward hosting project
        run: |
          node -e "
            const fs = require('fs');
            const files = ['public/academy.html', 'public/academy-config.js', 'public/login.html', 'scripts/inject-academy-env.cjs'];
            for (const f of files) {
              const src = fs.readFileSync(f, 'utf8');
              if (/vibraaltoai-11f55/.test(src)) {
                console.error('FAIL: ' + f + ' references vibraaltoai-11f55 (hosting project)');
                process.exit(1);
              }
            }
            console.log('No frontend/script files reference hosting project — OK');
          "

      - name: Validate login does not allow demo via query string
        run: |
          if grep -q 'demo=true' public/login.html; then
            echo "FAIL: login.html still allows demo activation via query string"
            exit 1
          fi
          echo "No query-string demo activation in login — OK"

      - name: Validate no service accounts or admin credentials in public
        run: |
          for f in public/login.html public/academy.html public/academy-config.js; do
            if grep -qiE 'service[_-]?account|admin[_-]?sdk|firebase[_-]?admin|FIREBASE_TOKEN' "$f"; then
              echo "FAIL: Possible admin credential reference in $f"
              exit 1
            fi
          done
          echo "No admin credentials in frontend files — OK"

  validate-print:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run print preflight analysis
        run: node scripts/preflight-print.cjs

      - name: Run geometry repair pipeline
        run: node scripts/repair-geometry.cjs

      - name: Validate geometry gate
        run: |
          GATE=assets/models/GEOMETRY_GATE.json
          test -f "$GATE"
          node -e "
            const g = require('./' + process.argv[1]);
            const checks = [
              ['boundary',                g.boundary === 0,                             g.boundary],
              ['nonManifold',             g.nonManifold === 0,                           g.nonManifold],
              ['degenerate',              g.degenerate === 0,                            g.degenerate],
              ['components',              g.components === 1,                            g.components],
              ['watertight',              g.watertight === true,                         g.watertight],
              ['normalsOutward',          g.normalsOutward === true,                     g.normalsOutward],
              ['heightMM',                g.heightMM <= 200,                             g.heightMM],
              ['widthMM',                 g.widthMM <= 200,                              g.widthMM],
              ['depthMM',                 g.depthMM <= 200,                              g.depthMM],
              ['volumeCM3',               g.volumeCM3 > 0,                               g.volumeCM3],
              ['hollowReductionPct',      g.hollowReductionPct >= 50,                    g.hollowReductionPct],
              ['shellThicknessMM',        g.shellThicknessMM >= 1.5,                     g.shellThicknessMM],
              ['drainCount',              g.drainCount >= 2,                             g.drainCount],
              ['sealedCavityCount',       g.sealedCavityCount === 0,                     g.sealedCavityCount],
              ['drainReachableVolumePct', g.drainReachableVolumePct === 100,             g.drainReachableVolumePct],
              ['stlSHA256',               typeof g.stlSHA256 === 'string' && g.stlSHA256.length === 64, g.stlSHA256],
              ['threemfSHA256',           typeof g.threemfSHA256 === 'string' && g.threemfSHA256.length === 64, g.threemfSHA256],
              ['fidelityP95MM',          g.fidelityP95MM <= g.fidelityThresholdP95MM,   g.fidelityP95MM + ' <= ' + g.fidelityThresholdP95MM],
              ['removedPct',             g.removedPct <= g.removedThresholdPct,          g.removedPct + '% <= ' + g.removedThresholdPct + '%'],
              ['pass',                    g.pass === true,                               g.pass],
            ];
            let ok = true;
            for (const [k, pass, val] of checks) {
              console.log(pass ? 'PASS' : 'FAIL', k, '=', val);
              if (!pass) ok = false;
            }
            if (!ok) { console.error('GATE FAILED'); process.exit(1); }
            console.log('ALL GATES PASSED');
          " "$GATE"

      - name: Validate STL and 3MF exist and are non-trivial
        run: |
          STL=assets/models/DMF_RELIC_01_ALPHA.stl
          test -f "$STL"
          SIZE=$(stat -c%s "$STL")
          test "$SIZE" -gt 1000000
          echo "STL size: ${SIZE} bytes — OK"
          THREEMF=assets/models/DMF_RELIC_01.3mf
          test -f "$THREEMF"
          TMFSIZE=$(stat -c%s "$THREEMF")
          test "$TMFSIZE" -gt 100000
          echo "3MF size: ${TMFSIZE} bytes — OK"

      - name: Validate 3MF structure
        run: |
          THREEMF=assets/models/DMF_RELIC_01.3mf
          echo "Checking ZIP integrity..."
          unzip -t "$THREEMF"
          echo ""
          echo "Checking required entries..."
          unzip -l "$THREEMF" | grep -q '\[Content_Types\].xml'
          unzip -l "$THREEMF" | grep -q '_rels/.rels'
          unzip -l "$THREEMF" | grep -q '3D/3dmodel.model'
          echo "All required entries present."
          echo ""
          echo "Checking XML well-formedness..."
          unzip -p "$THREEMF" '3D/3dmodel.model' | node -e "
            const data = require('fs').readFileSync('/dev/stdin', 'utf8');
            if (!data.includes('<model')) { console.error('Missing <model> root'); process.exit(1); }
            if (!data.includes('<vertices>')) { console.error('Missing <vertices>'); process.exit(1); }
            if (!data.includes('<triangles>')) { console.error('Missing <triangles>'); process.exit(1); }
            if (!data.includes('unit=\"millimeter\"')) { console.error('Missing unit=millimeter'); process.exit(1); }
            const vCount = (data.match(/<vertex /g) || []).length;
            const tCount = (data.match(/<triangle /g) || []).length;
            if (vCount < 1000) { console.error('Too few vertices: ' + vCount); process.exit(1); }
            if (tCount < 1000) { console.error('Too few triangles: ' + tCount); process.exit(1); }
            console.log('3MF model: ' + vCount + ' vertices, ' + tCount + ' triangles');
            console.log('XML structure valid.');
          "

      - name: Verify STL + 3MF reproducibility (SHA-256)
        run: |
          EXPECTED_STL=$(node -e "const g=require('./assets/models/GEOMETRY_GATE.json'); console.log(g.stlSHA256)")
          ACTUAL_STL=$(sha256sum assets/models/DMF_RELIC_01_ALPHA.stl | cut -d' ' -f1)
          if [ "$EXPECTED_STL" != "$ACTUAL_STL" ]; then
            echo "FAIL: STL SHA-256 mismatch"
            echo "  Expected: $EXPECTED_STL"
            echo "  Actual:   $ACTUAL_STL"
            exit 1
          fi
          echo "STL SHA-256 verified: $ACTUAL_STL"
          EXPECTED_3MF=$(node -e "const g=require('./assets/models/GEOMETRY_GATE.json'); console.log(g.threemfSHA256)")
          ACTUAL_3MF=$(sha256sum assets/models/DMF_RELIC_01.3mf | cut -d' ' -f1)
          if [ "$EXPECTED_3MF" != "$ACTUAL_3MF" ]; then
            echo "FAIL: 3MF SHA-256 mismatch"
            echo "  Expected: $EXPECTED_3MF"
            echo "  Actual:   $ACTUAL_3MF"
            exit 1
          fi
          echo "3MF SHA-256 verified: $ACTUAL_3MF"

      - name: Verify pipeline reproducibility
        run: |
          echo "Checking GEOMETRY_GATE.json matches committed version..."
          git diff --exit-code assets/models/GEOMETRY_GATE.json || {
            echo "FAIL: GEOMETRY_GATE.json differs from committed version"
            echo "The repair pipeline is not reproducible — committed gate does not match regenerated."
            exit 1
          }
          echo "Checking PRINT_PREFLIGHT_REPORT.md matches committed version..."
          git diff --exit-code assets/models/PRINT_PREFLIGHT_REPORT.md || {
            echo "FAIL: PRINT_PREFLIGHT_REPORT.md differs from committed version"
            exit 1
          }
          echo "Pipeline reproducibility verified — committed artifacts match regenerated."
