name: Deploy DMF Landing to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build public directory
        run: |
          mkdir -p public/assets/images public/assets/logos public/assets/docs public/assets/models
          node scripts/check-3d.cjs
          node scripts/verify-3d-checksum.cjs
          node scripts/build-3d.cjs
          node scripts/inject-codex.cjs
          node scripts/inject-oracle.cjs
          node scripts/inject-transmission.cjs
          node scripts/inject-compute-uplink.cjs
          cp -r assets/images/* public/assets/images/ 2>/dev/null || true
          cp -r assets/logos/* public/assets/logos/ 2>/dev/null || true
          cp -r assets/docs/* public/assets/docs/ 2>/dev/null || true
          cp -r assets/models/* public/assets/models/ 2>/dev/null || true
          cat assets/models/dmf-signal.part0.b64 \
              assets/models/dmf-signal.part1.b64 \
              assets/models/dmf-signal.part2.b64 \
              assets/models/dmf-signal.part3.b64 \
            | base64 --decode > public/assets/models/dmf-signal-chrome.glb
          rm -f public/assets/models/dmf-signal.part*.b64
          if [ -d assets/videos ]; then
            mkdir -p public/assets/videos
            cp -r assets/videos/* public/assets/videos/ 2>/dev/null || true
          fi
          echo "Files ready for deploy:"
          find public -type f | head -60

      - name: Validate Function syntax
        run: node --check functions/index.js

      - name: Configure VBC Compute secret
        id: vbc-secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          VBC_SERVICE_KEY: ${{ secrets.VBC_SERVICE_KEY }}
          VBC_CANARY_SERVICE_KEY: ${{ secrets.VBC_CANARY_SERVICE_KEY }}
        run: |
          KEY="$VBC_SERVICE_KEY"
          if [ -z "$KEY" ]; then KEY="$VBC_CANARY_SERVICE_KEY"; fi
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" | firebase functions:secrets:set VBC_SERVICE_KEY --data-file=- --force
            echo "functions_ready=true" >> "$GITHUB_OUTPUT"
            echo "VBC Compute secret synchronized for dmfTraining."
          else
            echo "functions_ready=false" >> "$GITHUB_OUTPUT"
            echo "No VBC_SERVICE_KEY or VBC_CANARY_SERVICE_KEY GitHub secret found. Hosting will deploy with the local DMF fallback engine; dmfTraining will not be deployed in this run."
          fi

      - name: Deploy Hosting + DMF Training Function
        if: steps.vbc-secret.outputs.functions_ready == 'true'
        run: firebase deploy --only "hosting,functions:dmfTraining"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Hosting fallback
        if: steps.vbc-secret.outputs.functions_ready != 'true'
        run: firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
