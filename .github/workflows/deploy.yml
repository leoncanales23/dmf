name: Deploy DMF Landing to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build public directory
        run: |
          mkdir -p public/assets/images public/assets/logos public/assets/docs
          cp index.html public/index.html
          cp -r assets/images/* public/assets/images/ 2>/dev/null || true
          cp -r assets/logos/* public/assets/logos/ 2>/dev/null || true
          cp -r assets/docs/* public/assets/docs/ 2>/dev/null || true
          if [ -d assets/videos ]; then
            mkdir -p public/assets/videos
            cp -r assets/videos/* public/assets/videos/ 2>/dev/null || true
          fi
          echo "Files ready for deploy:"
          find public -type f | head -50

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
